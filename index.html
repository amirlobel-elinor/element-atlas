<style>
:root{--bg:#e9eef4;--ink:#13223a;--mut:#56677f;--card:#fbfcfe;--line:#c9d4e2;--acc:#2a56e8;--cl:83%;--ok:#1b8f4e;--bad:#d03a34;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1826;--ink:#e6edf7;--mut:#93a4bd;--card:#17233a;--line:#2b3b57;--acc:#7a9bff;--cl:27%;--ok:#2fae6a;--bad:#e2564f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1826;--ink:#e6edf7;--mut:#93a4bd;--card:#17233a;--line:#2b3b57;--acc:#7a9bff;--cl:27%;--ok:#2fae6a;--bad:#e2564f;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Figtree,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:12px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
h1,h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.15rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.lab{color:var(--mut);font-size:.85rem;margin:12px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:5px 12px}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.go{margin-top:14px;background:var(--acc);color:#fff;border:0;border-radius:10px;padding:10px 20px;font-weight:600}
.bar{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:.9rem;gap:8px}
.prompt{font:800 1.35rem/1.2 "Bricolage Grotesque",system-ui,sans-serif;margin:8px 0}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.fb{margin-top:10px;font-weight:600}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px 14px;margin-top:8px}
.facts b{display:block;font-size:.8rem;color:var(--mut);font-weight:400}
#t{display:grid;grid-template-columns:repeat(18,1fr);grid-template-rows:repeat(7,auto) 8px auto auto;gap:2px}
.c{aspect-ratio:1;padding:0;border:0;border-radius:4px;background:hsl(var(--h) 42% var(--cl));color:var(--ink);font-size:clamp(8px,2.3vw,15px);font-weight:600;display:flex;align-items:center;justify-content:center}
.c.hl{outline:3px solid var(--acc);outline-offset:1px;position:relative;z-index:1}
.c.good{background:var(--ok);color:#fff}.c.bad{background:var(--bad);color:#fff}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:.8rem;color:var(--mut)}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;background:hsl(var(--h) 42% var(--cl))}
.miss{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.miss span{background:var(--bg);border-radius:6px;padding:2px 8px;font-size:.9rem}
[hidden]{display:none!important}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.col{display:grid;gap:8px;align-content:start}
.opt{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;text-align:left}
.opt[aria-pressed=true]{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.opt.good{background:var(--ok);border-color:var(--ok);color:#fff}.opt.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}

const H={alk:0,ake:30,tm:210,pt:165,mt:270,nm:110,hal:50,nob:320,lan:240,act:345};
const CN={alk:'Alkali metals',ake:'Alkaline earth',tm:'Transition metals',pt:'Post-transition',mt:'Metalloids',nm:'Nonmetals',hal:'Halogens',nob:'Noble gases',lan:'Lanthanides',act:'Actinides'};
const PE=[2,10,18,36,54,86,118],E=[null];
RAW.split('\n').forEach((l,i)=>{
  const [s,n,w,c]=l.split('|'),z=i+1;
  let p=0;while(z>PE[p])p++;
  const k=z-(p?PE[p-1]:0);let r=p+1,col,g=null;
  if(p==0)col=k==1?1:18;
  else if(p<3)col=k<=2?k:k+10;
  else if(p<5)col=k;
  else if(k<=2)col=k;
  else if(k<=17){r=p==5?9:10;col=k}
  else col=k-14;
  if(r<=7)g=col;
  let v=null;if(g==1)v=1;else if(g==2)v=2;else if(g>=13)v=z==2?2:g==18?8:g-10;
  const lis=[3,11,19,37,55,87],ake=[4,12,20,38,56,88],hal=[9,17,35,53,85,117],nob=[2,10,18,36,54,86,118],mt=[5,14,32,33,51,52],nm=[1,6,7,8,15,16,34];
  const cat=lis.includes(z)?'alk':ake.includes(z)?'ake':hal.includes(z)?'hal':nob.includes(z)?'nob':mt.includes(z)?'mt':nm.includes(z)?'nm':r==9?'lan':r==10?'act':g>=3&&g<=12?'tm':'pt';
  E.push({z,s,n,w,ch:c?c.split(','):[],p:p+1,g,v,r,c:col,cat});
});
const ION={1:'+1',3:'+1',7:'-3',8:'-2',9:'-1',11:'+1',12:'+2',13:'+3',15:'-3',16:'-2',17:'-1',19:'+1',20:'+2',24:'+3',25:'+2',26:'+2,+3',27:'+2',28:'+2',29:'+2,+1',30:'+2',35:'-1',38:'+2',47:'+1',50:'+2,+4',53:'-1',56:'+2',80:'+2,+1',82:'+2'};
const POLY={1:'NH₄⁺, OH⁻, H₃O⁺',7:'NO₃⁻, NO₂⁻, NH₄⁺',8:'nearly every polyatomic ion',15:'PO₄³⁻',16:'SO₄²⁻, SO₃²⁻',17:'ClO₃⁻, ClO₄⁻',24:'CrO₄²⁻, Cr₂O₇²⁻',25:'MnO₄⁻',35:'BrO₃⁻',53:'IO₃⁻'};
const GN=['Alkali metals','Alkaline earth metals','Transition metals','Boron group','Carbon group','Pnictogens','Chalcogens','Halogens','Noble gases','Lanthanides','Actinides'];
E.forEach(e=>{if(!e)return;e.ch=ION[e.z]?ION[e.z].split(','):[];const g=e.g;e.gn=e.z==1?null:e.cat=='lan'?GN[9]:e.cat=='act'?GN[10]:g==1?GN[0]:g==2?GN[1]:g<=12?GN[2]:GN[g-10]});
const $=q=>document.querySelector(q);
const S={mode:'find',range:'20',len:'20',by:'name',sym:true,tab:true,scr:'menu',q:[],i:0,ok:0,miss:[],hz:null,cls:{},fb:null,sel:null,opts:[],m:null,rounds:[],pk:null};
const MODES=[['find','Find on table'],['id','Name the element'],['number','Atomic number'],['weight','Atomic weight'],['valence','Valence electrons'],['charge','Ion charge'],['period','Period'],['group','Group'],['pick','Group name: choose'],['match','Group name: match']];
const LBL={number:'Atomic number of',weight:'Atomic weight of',valence:'Valence electrons in',charge:'Common ion charge of',period:'Period of',group:'Group of'};
const PH={number:'e.g. 26',weight:'e.g. 55.8',valence:'e.g. 2',charge:'e.g. +2 or 3-',period:'e.g. 4',group:'e.g. 8',id:'Name or symbol'};
const RNG=[['20','H to Ca (1–20)'],['36','H to Kr (1–36)'],['54','H to Xe (1–54)'],['main','Main groups'],['all','All 118']];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const chips=(k,items)=>`<div class="chips">${items.map(([v,l])=>`<button class="chip" data-k="${k}" data-v="${v}" aria-pressed="${String(S[k])==v}">${l}</button>`).join('')}</div>`;
function pool(){
  let a=E.slice(1);
  if(S.range=='main')a=a.filter(e=>e.v!=null);else if(S.range!='all')a=a.filter(e=>e.z<=+S.range);
  if(S.mode=='valence')a=a.filter(e=>e.v!=null);
  if(S.mode=='charge')a=a.filter(e=>e.ch.length);
  if(S.mode=='group')a=a.filter(e=>e.g!=null);
  if(S.mode=='pick'||S.mode=='match')a=a.filter(e=>e.gn);
  return a;
}
function start(list){
  if(S.mode=='match')return startMatch(list);
  S.q=list||shuffle(pool()).slice(0,S.len=='all'?999:+S.len);
  S.i=0;S.ok=0;S.miss=[];S.fb=null;S.cls={};S.scr='q';S.sel=null;
  S.hz=S.mode=='find'?null:S.q[0].z;setOpts();render();
}
function setOpts(){
  S.pk=null;if(S.mode!='pick')return;
  const e=S.q[S.i];
  S.opts=shuffle([e.gn,...shuffle(GN.filter(g=>g!=e.gn)).slice(0,3)]);
}
function setRound(){
  const L=S.rounds[S.i];
  S.m={L,R:shuffle(L.map(e=>e.gn)),done:{},sel:null,bad:null,errs:{},fin:false};S.hz=null;
}
function startMatch(list){
  const src=list&&new Set(list.map(e=>e.gn)).size>1?list:pool();
  const by={};src.forEach(e=>(by[e.gn]=by[e.gn]||[]).push(e));
  const names=Object.keys(by);if(names.length<2)return;
  S.rounds=[0,1,2].map(()=>shuffle(names).slice(0,6).map(n=>by[n][Math.random()*by[n].length|0]));
  S.q=S.rounds.flat();S.i=0;S.ok=0;S.miss=[];S.fb=null;S.cls={};S.scr='q';S.sel=null;setRound();render();
}
function matchTap(t,v){
  const m=S.m;if(m.fin)return;
  if(t=='l'){if(!m.done[v]){m.sel=+v;S.hz=+v}render();return}
  if(!m.sel)return;
  const e=E[m.sel];
  if(e.gn==v){m.done[e.z]=1;if(!m.errs[e.z])S.ok++;m.sel=null;S.hz=null;m.fin=m.L.every(x=>m.done[x.z])}
  else{if(!m.errs[e.z]){m.errs[e.z]=1;S.miss.push(e)}m.bad=v;setTimeout(()=>{if(S.m===m){m.bad=null;render()}},700)}
  render();
}
function pickTap(v){
  if(S.fb)return;
  const e=S.q[S.i],ok=v==e.gn;S.pk=v;S.cls[e.z]=ok?'good':'bad';
  record(ok,e,ok?'Correct':'Answer: '+e.gn);
}
function pickHtml(e){
  return `<div class="opts">${S.opts.map(o=>`<button class="opt ${S.fb&&o==e.gn?'good':S.fb&&o==S.pk?'bad':''}" data-act="opt" data-v="${o}" ${S.fb?'disabled':''}>${o}</button>`).join('')}</div>`;
}
function matchPanel(p){
  const m=S.m,tot=S.rounds.length;
  const mn=new Set(m.L.filter(e=>m.done[e.z]).map(e=>e.gn));
  p.innerHTML=`<div class="bar"><span>Round ${S.i+1} of ${tot} · ${S.ok} right first try</span><button class="ghost" data-act="quit">End</button></div><div class="prompt">Match each element to its group</div>
  <div class="opts"><div class="col">${m.L.map(e=>`<button class="opt ${m.done[e.z]?'good':''}" aria-pressed="${m.sel==e.z}" data-act="ml" data-v="${e.z}" ${m.done[e.z]?'disabled':''}>${e.s} · ${e.n}</button>`).join('')}</div>
  <div class="col">${m.R.map(g=>`<button class="opt ${mn.has(g)?'good':m.bad==g?'bad':''}" data-act="mr" data-v="${g}" ${mn.has(g)?'disabled':''}>${g}</button>`).join('')}</div></div>
  ${m.fin?`<button class="go" data-act="mnext">${S.i+1<tot?'Next round':'See results'}</button>`:'<div class="fb">Tap an element, then its group.</div>'}`;
}
function next(){
  S.i++;S.fb=null;S.cls={};
  if(S.i>=S.q.length){S.scr='done';S.hz=null}else{S.hz=S.mode=='find'?null:S.q[S.i].z;setOpts()}
  render();
}
function record(ok,e,msg){
  if(ok)S.ok++;else S.miss.push(e);
  S.fb={ok,msg};render();
  if(ok){const t=S.i;setTimeout(()=>{if(S.scr=='q'&&S.i==t&&S.fb)next()},S.fb.msg.length>9?2200:700)}
}
const pc=v=>{const s=v.replace(/\s/g,'');if(/^(0|none|±0)$/i.test(s))return 0;const m=s.match(/^([+-])?(\d)([+-])?$/);if(!m)return NaN;const x=+m[2];return(m[1]||m[3])=='-'?-x:x};
const ALT={aluminium:'aluminum',caesium:'cesium',sulphur:'sulfur'};
function judge(e,v){
  const m=S.mode;v=v.trim();
  if(m=='id'){v=v.toLowerCase();v=ALT[v]||v;return v==e.n.toLowerCase()||v==e.s.toLowerCase()}
  if(m=='charge'){const c=pc(v);return!isNaN(c)&&e.ch.some(x=>parseInt(x)==c)}
  if(v==='')return false;
  if(m=='weight')return Math.abs(parseFloat(v)-parseFloat(e.w))<=0.5;
  return +v=={number:e.z,valence:e.v,period:e.p,group:e.g}[m];
}
function answer(e){return{id:`${e.n} (${e.s})`,number:e.z,weight:e.w,valence:e.v,period:e.p,group:e.g,charge:e.ch.join(' or ')}[S.mode]}
function check(){
  if(S.fb)return next();
  const e=S.q[S.i],ok=judge(e,$('#in').value);
  S.cls[e.z]=ok?'good':'bad';
  let msg=ok?'Correct':'Answer: '+answer(e);
  if(S.mode=='charge'&&POLY[e.z])msg+=' · Found in '+POLY[e.z];
  record(ok,e,msg);
}
function findClick(z){
  if(S.fb)return;
  const e=S.q[S.i],ok=z==e.z;
  S.cls[e.z]='good';if(!ok)S.cls[z]='bad';
  record(ok,e,ok?'Correct':`That was ${E[z].n}. ${e.n} is shown in green.`);
}
function renderTable(){
  const hid=S.scr=='q'&&!S.tab&&!['find','id'].includes(S.mode);$('#t').hidden=hid;$('#lg').hidden=hid;
  const show=e=>S.scr!='q'||S.cls[e.z]||(S.mode=='find'?S.sym:S.mode!='id');
  $('#t').innerHTML=E.slice(1).map(e=>`<button class="c ${S.cls[e.z]||(S.scr=='q'&&S.hz==e.z?'hl':'')}" data-z="${e.z}" aria-label="${e.n}" style="--h:${H[e.cat]};grid-row:${e.r};grid-column:${e.c}">${show(e)?e.s:''}</button>`).join('');
}
function renderPanel(){
  const p=$('#p');
  if(S.scr=='menu'){
    let d='';
    if(S.sel){const e=E[S.sel];d=`<div class="card" style="background:var(--bg)"><h2>${e.n} (${e.s})</h2><div class="facts"><div><b>Atomic number</b>${e.z}</div><div><b>Atomic weight</b>${e.w}</div><div><b>Period</b>${e.p}</div><div><b>Group</b>${e.g??'f-block'}</div><div><b>Valence electrons</b>${e.v??'varies'}</div><div><b>Common ion charge</b>${e.ch.join(', ')||'rarely forms simple ions'}</div></div></div>`}
    p.innerHTML=`<h2>Build a quiz</h2>${d}<div class="lab">Quiz type</div>${chips('mode',MODES)}
    ${S.mode=='find'?`<div class="lab">Find by</div>${chips('by',[['name','Name'],['symbol','Symbol'],['number','Number']])}<div class="lab">Symbols on the table</div>${chips('sym',[['true','Shown'],['false','Hidden']])}`:''}
    ${['find','id'].includes(S.mode)?'':`<div class="lab">Periodic table during quiz</div>${chips('tab',[['true','Shown'],['false','Hidden']])}`}<div class="lab">Elements</div>${chips('range',RNG)}${S.mode=='match'?'<p class="lab">Three rounds of up to six pairs.</p>':`<div class="lab">Questions</div>${chips('len',[['10','10'],['20','20'],['all','All']])}`}
    <button class="go" data-act="start">Start quiz</button><p class="lab">Or tap any element on the table to study it. Weights: the nearest whole number counts. Valence electrons cover main-group elements; ion charges cover the key ions that bond ionically and appear in polyatomic ions.</p>`;
  }else if(S.scr=='q'&&S.mode=='match'){matchPanel(p)
  }else if(S.scr=='q'){
    const e=S.q[S.i],m=S.mode;
    const pr=m=='find'?(S.by=='name'?`Find ${e.n}`:S.by=='symbol'?`Find ${e.s}`:`Find element ${e.z}`):m=='id'?'Which element is highlighted?':m=='pick'?`Which group is <u>${e.n}</u> (${e.s}) in?`:`${LBL[m]} <u>${e.n}</u> (${e.s})`;
    p.innerHTML=`<div class="bar"><span>Question ${S.i+1} of ${S.q.length} · ${S.ok} correct</span><button class="ghost" data-act="quit">End</button></div><div class="prompt">${pr}</div>
    ${m=='find'?'':m=='pick'?pickHtml(e):`<div class="row"><input id="in" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="go" placeholder="${PH[m]}" ${S.fb?'readonly':''}><button class="go" style="margin:0" data-act="check">${S.fb?'Next':'Check'}</button></div>`}
    <div class="fb ${S.fb?S.fb.ok?'ok':'no':''}" aria-live="polite">${S.fb?S.fb.msg:''}</div>${S.fb&&!S.fb.ok&&(m=='find'||m=='pick')?'<button class="go" data-act="next">Next</button>':''}`;
    const i=$('#in');if(i&&!S.fb)i.focus();
  }else{
    const n=S.q.length,pct=Math.round(S.ok/n*100);
    p.innerHTML=`<h2>${S.ok} of ${n} correct (${pct}%)</h2>${S.miss.length?`<div class="lab">To review</div><div class="miss">${S.miss.map(e=>`<span>${e.s} · ${e.n}</span>`).join('')}</div>`:'<p>Perfect round.</p>'}
    ${S.miss.length?'<button class="go" data-act="retry">Retry missed</button> ':''}<button class="go" data-act="menu">New quiz</button>`;
  }
}
function render(){renderPanel();renderTable()}
$('#p').addEventListener('click',ev=>{
  const b=ev.target.closest('button');if(!b)return;
  if(b.dataset.k){let v=b.dataset.v;S[b.dataset.k]=v=='true'?true:v=='false'?false:v;render();return}
  const a=b.dataset.act;
  if(a=='start'){if(!pool().length)return;start()}
  else if(a=='check')check();
  else if(a=='next')next();
  else if(a=='opt')pickTap(b.dataset.v);
  else if(a=='ml')matchTap('l',b.dataset.v);
  else if(a=='mr')matchTap('r',b.dataset.v);
  else if(a=='mnext'){S.i++;if(S.i>=S.rounds.length){S.scr='done';S.hz=null}else setRound();render()}
  else if(a=='quit'){S.scr='done';S.hz=null;S.cls={};render()}
  else if(a=='retry')start(shuffle(S.miss));
  else if(a=='menu'){S.scr='menu';S.hz=null;S.cls={};render()}
});
$('#p').addEventListener('keydown',ev=>{if(ev.key=='Enter'&&ev.target.id=='in')check()});
$('#t').addEventListener('click',ev=>{
  const b=ev.target.closest('.c');if(!b)return;const z=+b.dataset.z;
  if(S.scr=='q'){if(S.mode=='find')findClick(z)}else if(S.scr=='menu'){S.sel=z;render()}
});
$('#th').onclick=()=>{const r=document.documentElement,d=matchMedia('(prefers-color-scheme:dark)').matches;const cur=r.dataset.theme||(d?'dark':'light');r.dataset.theme=cur=='dark'?'light':'dark'};
$('#lg').innerHTML=Object.keys(CN).map(k=>`<span><i style="--h:${H[k]}"></i>${CN[k]}</span>`).join('');
render();
if('serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script></body></html>
