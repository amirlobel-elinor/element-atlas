<style>/* A small, non-sticky site switcher. Its panel is hidden until requested. */
.pa-switcher-row{box-sizing:border-box;display:flex;justify-content:flex-end;flex:0 0 auto;width:100%;max-width:1240px;margin:0 auto;padding:14px 44px 0}
body[data-atlas-site="chem"] .pa-switcher-row + .shell{padding-top:14px}
body[data-atlas-site="element"] .pa-switcher-row{width:auto;max-width:none;margin-left:var(--sidebar-width);padding:14px 40px 0}
body[data-atlas-site="element"] .pa-switcher-row + .app-main{padding-top:14px}
body[data-atlas-site="bio"] .main > .topbar{justify-content:flex-start}
body[data-atlas-site="bio"] .main > .topbar > .pa-switcher{margin-left:auto;flex:0 0 44px}
body[data-atlas-site="bio"] .main > .topbar > select{min-width:0;flex:1 1 170px}
.pa-switcher,.pa-switcher *{box-sizing:border-box}
.pa-switcher{--pa-bg:#fff;--pa-ink:#302b43;--pa-line:#ded9e8;--pa-hover:#f3f0fa;--pa-accent:#7058b5;position:relative;z-index:30;flex:0 0 44px;width:44px;margin:0;padding:0;border:0;background:none;color:var(--pa-ink);font:600 13px/1.4 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.pa-switcher > .pa-switcher-trigger{display:flex;align-items:center;justify-content:center;gap:3px;width:44px;height:44px;min-height:44px;margin:0;padding:9px;border:1px solid var(--pa-line);border-radius:12px;background:var(--pa-bg);color:var(--pa-ink);cursor:pointer;list-style:none;box-shadow:0 2px 0 #27203308;user-select:none;transition:background .12s,border-color .12s}
.pa-switcher > .pa-switcher-trigger::-webkit-details-marker{display:none}
.pa-switcher > .pa-switcher-trigger::marker{content:""}
.pa-switcher > .pa-switcher-trigger::after{display:none}
.pa-switcher > .pa-switcher-trigger:hover,.pa-switcher[open] > .pa-switcher-trigger{background:var(--pa-hover);border-color:var(--pa-accent)}
.pa-switcher .pa-switcher-icon{display:block;flex:0 0 20px;width:20px;height:20px;color:currentColor}
.pa-switcher .pa-switcher-panel{position:absolute;inset:calc(100% + 8px) 0 auto auto;width:270px;max-width:calc(100vw - 32px);max-height:calc(100dvh - 100px);overflow-y:auto;padding:9px;border:1px solid var(--pa-line);border-radius:16px;background:var(--pa-bg);color:var(--pa-ink);box-shadow:0 12px 36px #21133625;overscroll-behavior:contain}
.pa-switcher:not([open]) > .pa-switcher-panel{display:none}
.pa-switcher .pa-switcher-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 6px;padding:0 1px 7px 9px;border-bottom:1px solid var(--pa-line)}
.pa-switcher .pa-switcher-title{font:700 12px/1.3 ui-sans-serif,system-ui,sans-serif;color:var(--pa-ink);letter-spacing:.2px}
.pa-switcher .pa-switcher-home{display:flex;align-items:center;justify-content:center;flex:0 0 44px;width:44px;height:44px;border:1px solid var(--pa-line);border-radius:10px;background:var(--pa-bg);color:var(--pa-ink);text-decoration:none}
.pa-switcher .pa-switcher-link{display:flex;align-items:center;gap:11px;min-height:46px;margin:3px 0 0;padding:11px 12px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--pa-ink);font:600 13px/1.4 ui-sans-serif,system-ui,sans-serif;text-decoration:none}
.pa-switcher .pa-switcher-link > span{font:inherit;color:inherit}
.pa-switcher .pa-switcher-link:hover,.pa-switcher .pa-switcher-home:hover{background:var(--pa-hover);border-color:var(--pa-line)}
.pa-switcher .pa-switcher-link[aria-current="page"]{background:var(--pa-hover);border-color:var(--pa-line);font-weight:750}
.pa-switcher .pa-switcher-link[aria-current="page"]::after{content:"";width:7px;height:7px;flex:0 0 7px;margin-left:auto;border-radius:50%;background:var(--pa-accent)}
.pa-switcher :is(summary,a):focus-visible{outline:3px solid var(--pa-accent);outline-offset:2px}
body[data-atlas-site="chem"] .pa-switcher{--pa-accent:#315f94;--pa-hover:#eef4fb}
body[data-atlas-site="bio"] .pa-switcher{--pa-accent:#30795f;--pa-hover:#edf5e9;--pa-ink:#243d35;--pa-line:#dce5d8}
body[data-atlas-site="element"] .pa-switcher{--pa-accent:#a65020;--pa-hover:#fff0df;--pa-ink:#4b3024;--pa-line:#ecd5bc;--pa-bg:#fffaf4}
html[data-theme="dark"] .pa-switcher{--pa-bg:#272232;--pa-ink:#f0eaf7;--pa-line:#51465f;--pa-hover:#392f47;--pa-accent:#cbb5fa}
html[data-theme="dark"] body[data-atlas-site="element"] .pa-switcher{--pa-bg:#2b221d;--pa-ink:#f8eadc;--pa-line:#66503e;--pa-hover:#443124;--pa-accent:#ffc48e}
@media(max-width:1100px){.pa-switcher-row{padding-right:28px;padding-left:28px}}
@media(max-width:950px){body[data-atlas-site="element"] .pa-switcher-row{margin-left:0;padding-right:24px;padding-left:24px}}
@media(max-width:860px){body[data-atlas-site="chem"] .pa-switcher-row{padding-right:24px;padding-left:24px}}
@media(max-width:780px){body[data-atlas-site="bio"] .main > .topbar{gap:8px}body[data-atlas-site="bio"] .main > .topbar > select{max-width:none;flex-basis:0}body[data-atlas-site="bio"] .search-button{flex-shrink:0}}
@media(max-width:600px){.pa-switcher-row,body[data-atlas-site="element"] .pa-switcher-row,body[data-atlas-site="chem"] .pa-switcher-row{padding:10px 18px 0}.pa-switcher .pa-switcher-panel{max-width:calc(100vw - 36px)}}
@media(prefers-reduced-motion:reduce){.pa-switcher > .pa-switcher-trigger{transition:none}}
@media print{.pa-switcher,.pa-switcher-row{display:none!important}}
</style>
<!-- ATLAS-SWITCHER-STYLE-END -->

<!-- ATLAS-SWITCHER-SCRIPT-START -->
<script>(function(){
  'use strict';
  const selector='.pa-switcher';
  const timers=new WeakMap();
  const nearest=target=>target instanceof Element?target.closest(selector):null;
  function cancel(menu){const timer=timers.get(menu);if(timer)clearTimeout(timer);timers.delete(menu);}
  function change(menu,open,mode='click'){
    cancel(menu);
    menu.open=open;
    menu.dataset.paOpenMode=open?mode:'';
    menu.querySelector('summary').setAttribute('aria-expanded',String(open));
  }
  function later(menu,callback,delay){cancel(menu);timers.set(menu,setTimeout(()=>{timers.delete(menu);if(menu.isConnected)callback();},delay));}
  document.addEventListener('click',event=>{
    const menu=nearest(event.target);if(!menu)return;
    if(event.target.closest('.pa-switcher-trigger')){
      event.preventDefault();event.stopPropagation();
      change(menu,!menu.open||menu.dataset.paOpenMode==='hover','click');
    }
  },true);
  document.addEventListener('pointerdown',event=>{
    document.querySelectorAll(selector+'[open]').forEach(menu=>{if(!menu.contains(event.target))change(menu,false);});
  },true);
  document.addEventListener('pointerover',event=>{
    const menu=nearest(event.target);
    if(!menu||event.pointerType!=='mouse'||!window.matchMedia('(hover:hover) and (pointer:fine)').matches)return;
    if(menu.contains(event.relatedTarget))return;
    cancel(menu);
    if(!menu.open)later(menu,()=>change(menu,true,'hover'),140);
  });
  document.addEventListener('pointerout',event=>{
    const menu=nearest(event.target);if(!menu||event.pointerType!=='mouse'||menu.contains(event.relatedTarget))return;
    cancel(menu);
    if(menu.open&&menu.dataset.paOpenMode==='hover')later(menu,()=>{
      if(!menu.contains(document.activeElement)||document.activeElement===menu.querySelector('summary'))change(menu,false);
    },240);
  });
  document.addEventListener('keydown',event=>{
    const menu=nearest(event.target);if(!menu)return;
    // Keep app shortcuts (quiz numbers, Enter, and glossary search) out of this control.
    event.stopPropagation();
    if(event.key==='Escape'&&menu.open){event.preventDefault();change(menu,false);menu.querySelector('summary').focus();}
    else if(event.key==='ArrowDown'&&event.target.closest('.pa-switcher-trigger')){
      event.preventDefault();change(menu,true,'keyboard');menu.querySelector('a').focus();
    }
  },true);
  document.addEventListener('focusout',event=>{
    const menu=nearest(event.target);if(!menu)return;
    if(!menu.contains(event.relatedTarget))change(menu,false);
  });
  document.addEventListener('toggle',event=>{
    if(event.target.matches?.(selector))event.target.querySelector('summary').setAttribute('aria-expanded',String(event.target.open));
  },true);
})();
</script>
<!-- ATLAS-SWITCHER-SCRIPT-END -->
